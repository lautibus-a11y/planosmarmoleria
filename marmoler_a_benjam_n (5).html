                        App.ui.tempElement = null;
                        Renderer.renderPreview();
                        Renderer.renderAll();
                        UI.updateDrawingHelper(false);
                    }
                },
                cancelPolyline() {
                    if (App.ui.tempElement) {
                        App.ui.tempElement = null;
                        Renderer.renderPreview();
                        Renderer.renderAll();
                        UI.updateDrawingHelper(false);
                        UI.showToast("Línea cancelada");
                    }
                },
                dblclick() {
                    if (App.ui.tempElement && App.ui.tempElement.type === 'polyline') {
                        this.finishPolyline();
                    }
                }
            },

            pencil: {
                down(wp) {
                    App.ui.tempElement = {
                        id: Utils.uuid(), type: 'pencil', points: [wp]
                    };
                },
                move(wp) {
                    if (App.ui.tempElement) {
                        App.ui.tempElement.points.push(wp);
                        Renderer.renderPreview();
                    }
                },
                up() {
                    if (App.ui.tempElement && App.ui.tempElement.points.length > 1) {
                        HistoryManager.pushState();
                        App.data.elements.push(App.ui.tempElement);
                    }
                    App.ui.tempElement = null;
                    Renderer.renderPreview();
                    Renderer.renderAll();
                }
            },

            measure: {
                getGeometryEdge(el, wp) {
                    if (!el) return null;
                    if (el.type === 'line') {
                        return { start: {...el.start}, end: {...el.end} };
                    }
                    if (el.type === 'rect' || el.type === 'square') {
                        const x1 = el.start.x, y1 = el.start.y;
                        const x2 = el.end.x, y2 = el.end.y;
                        const edges = [
                            { start: {x: x1, y: y1}, end: {x: x2, y: y1} }, // Arriba
                            { start: {x: x2, y: y1}, end: {x: x2, y: y2} }, // Derecha
                            { start: {x: x1, y: y2}, end: {x: x2, y: y2} }, // Abajo
                            { start: {x: x1, y: y1}, end: {x: x1, y: y2} }  // Izquierda
                        ];
                        let bestEdge = edges[0];
                        let bestDist = Infinity;
                        for (const ed of edges) {
                            const d = Tools.measure.distToSegment(wp, ed.start, ed.end);
                            if (d < bestDist) {
                                bestDist = d;
                                bestEdge = ed;
                            }
                        }
                        return bestEdge;
                    }
                    if (el.type === 'polyline') {
                        let bestEdge = null;
                        let bestDist = Infinity;
                        for (let i = 0; i < el.points.length - 1; i++) {
                            const pA = el.points[i];
                            const pB = el.points[i + 1];
                            const d = Tools.measure.distToSegment(wp, pA, pB);
                            if (d < bestDist) {
                                bestDist = d;
                                bestEdge = { start: {...pA}, end: {...pB} };
                            }
                        }
                        return bestEdge;
                    }
                    if (el.type === 'triangle') {
                        const edges = [
                            { start: {...el.points[0]}, end: {...el.points[1]} },
                            { start: {...el.points[1]}, end: {...el.points[2]} },
                            { start: {...el.points[2]}, end: {...el.points[0]} }
                        ];
                        let bestEdge = edges[0];
                        let bestDist = Infinity;
                        for (const ed of edges) {
                            const d = Tools.measure.distToSegment(wp, ed.start, ed.end);
                            if (d < bestDist) {
                                bestDist = d;
                                bestEdge = ed;
                            }
                        }
                        return bestEdge;
                    }
                    if (el.type === 'circle') {
                        return {
                            start: { x: el.center.x - el.radius, y: el.center.y },
                            end: { x: el.center.x + el.radius, y: el.center.y }
                        };
                    }
                    return null;
                },
                distToSegment(p, a, b) {
                    const l2 = (b.x - a.x)**2 + (b.y - a.y)**2;
                    if (l2 === 0) return Utils.distance(p, a);
                    let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    return Utils.distance(p, { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) });
                },
                _activeMeasure: null,
                _dragPrevPoint: null,
                _hasMoved: false,
                down(wp, e) {
                    const target = e.target;
                    const elNode = target.closest ? target.closest('[data-id]') : null;
                    const id = elNode ? elNode.getAttribute('data-id') : null;

                    if (id && id !== 'bg-rect' && id !== 'viewport-transform' && id !== 'scene' && id !== 'canvas') {
                        const el = App.data.elements.find(x => x.id === id);
                        if (el) {
                            // Si tocó una cota existente: permitir arrastrarla o editarla inline
                            if (el.type === 'measure') {
                                this._activeMeasure = el;
                                this._dragPrevPoint = wp;
                                this._hasMoved = false;
                                App.ui.selectedId = el.id;
                                Renderer.renderAll();
                                return;
                            }

                            // Si tocó cualquier elemento o figura: medir ese lado directamente
                            const edge = this.getGeometryEdge(el, wp);
                            if (edge) {
                                const dist = Utils.distance(edge.start, edge.end);
                                const defaultVal = Utils.formatMeasure(dist);
                                const mid = {
                                    x: (edge.start.x + edge.end.x) / 2,
                                    y: (edge.start.y + edge.end.y) / 2
                                };

                                const newM = {
                                    id: Utils.uuid(),
                                    type: 'measure',
                                    start: edge.start,
                                    end: edge.end,
                                    value: defaultVal
                                };
                                App.data.elements.push(newM);
                                App.ui.selectedId = newM.id;
                                Renderer.renderAll();

                                // Editor inline titilando sobre el número
                                CanvasInlineEditor.open(
                                    mid,
                                    defaultVal,
                                    defaultVal,
                                    (text) => {
                                        newM.value = text && text.trim() ? text.trim() : defaultVal;
                                        HistoryManager.pushState();
                                        Renderer.renderAll();
                                        UI.showToast("✓ Medida guardada");
                                    },
                                    () => {
                                        newM.value = defaultVal;
                                        HistoryManager.pushState();
                                        Renderer.renderAll();
                                    },
                                    { select: true, tip: "Enter ↵ para confirmar (o escribí otra medida)" }
                                );
                                return;
                            }
                        }
                    }

                    // Sino, dibujar línea de cota libre
                    const snap = Snapper.findSnap(wp);
                    const startP = snap ? {x: snap.x, y: snap.y} : wp;
                    App.ui.tempElement = {
                        id: Utils.uuid(), type: 'measure', start: startP, end: {...startP}, value: ""
                    };
                },
                move(wp) {
                    if (this._activeMeasure) {
                        this._hasMoved = true;
                        if (!this._dragPrevPoint) this._dragPrevPoint = wp;
                        const dx = wp.x - this._dragPrevPoint.x;
                        const dy = wp.y - this._dragPrevPoint.y;
                        this._dragPrevPoint = wp;

                        this._activeMeasure.start.x += dx;
                        this._activeMeasure.start.y += dy;
                        this._activeMeasure.end.x += dx;
                        this._activeMeasure.end.y += dy;
                        Renderer.renderAll();
                        return;
                    }

                    if (!App.ui.tempElement) return;
                    const snap = Snapper.findSnap(wp);
                    let currP = snap ? {x: snap.x, y: snap.y} : wp;
                    currP = Snapper.snapAngle(App.ui.tempElement.start, currP);
                    App.ui.tempElement.end = currP;
                    Renderer.renderPreview();
                    Renderer.drawSnap(snap);
                },
                up() {
                    if (this._activeMeasure) {
                        const mEl = this._activeMeasure;
                        const wasMoved = this._hasMoved;
                        this._activeMeasure = null;
                        this._dragPrevPoint = null;
                        this._hasMoved = false;

                        if (wasMoved) {
                            HistoryManager.pushState();
                            StorageManager.save();
                        } else {
                            // Fue click simple sobre la cota: editarla inline
                            const mid = {
                                x: (mEl.start.x + mEl.end.x) / 2,
                                y: (mEl.start.y + mEl.end.y) / 2
                            };
                            CanvasInlineEditor.open(
                                mid,

                                    }
                                },

                    if (App.ui.tempElement) {

                            // Abrir editor inline titilando sobre el número

                                },

                tryErase(clientX, clientY) {
                    // Pincel de borrar: comprueba qué elemento estamos tocando al arrastrar
                    const targetEl = document.elementFromPoint(clientX, clientY);
                    if (!targetEl) return;
                    
                    const elNode = targetEl.closest ? targetEl.closest('[data-id]') : null;
                    if (elNode) {
                        const id = elNode.getAttribute('data-id');
                        if (id && id !== 'bg-rect' && id !== 'viewport-transform' && id !== 'scene' && id !== 'canvas') {
                            const exists = App.data.elements.some(x => x.id === id);
                            if(exists) {

                                if(App.ui.selectedId === id) App.ui.selectedId = null;
                                Renderer.renderAll();
                            }
                        }
                    }
                }
            }

        function handlePointerDown(e) {
            // Si el editor inline estaba abierto y se hace click afuera, confirmar su valor
            if (typeof CanvasInlineEditor !== 'undefined' && CanvasInlineEditor._isOpen) {
                CanvasInlineEditor.commit();
            }

            // Evitar default para touch (scroll)
            if(e.pointerType === 'touch') e.preventDefault();
            
            App.ui.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            // Identificar si tocamos el fondo vacío
            const isBg = (e.target.id === 'bg-rect' || e.target.id === 'canvas' || e.target.tagName.toLowerCase() === 'svg');

            // Detectar Pan con 2 dedos, botón medio (PC) o arrastre de un dedo en el fondo estando en "Seleccionar"
            if (App.ui.activePointers.size === 2 || e.button === 1 || (App.ui.currentTool === 'select' && isBg)) {
                App.ui.isPanning = true;
                App.ui.dragStart = { x: e.clientX, y: e.clientY };
                App.ui.dragStartViewport = { x: App.viewport.x, y: App.viewport.y };
                App.DOM.workspace.style.cursor = 'grabbing';
                return;
            }

            // Flujo de herramienta normal (1 dedo / Pen / Mouse Izq)
            if (App.ui.activePointers.size === 1 && e.button === 0) {
                App.ui.isDragging = true;
                const wp = ViewportManager.screenToWorld(e.clientX, e.clientY);
                const tool = Tools[App.ui.currentTool];
                if (tool && tool.down) tool.down(wp, e);
            }
        }

        function handlePointerMove(e) {
            if (App.ui.activePointers.has(e.pointerId)) {
                App.ui.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            }

            // Paneo
            if (App.ui.isPanning) {
                if (App.ui.activePointers.size === 2) {
                    // Calcular centro de los dos dedos para paneo
                    const pts = Array.from(App.ui.activePointers.values());
                    const centerX = (pts[0].x + pts[1].x) / 2;
                    const centerY = (pts[0].y + pts[1].y) / 2;
                    
                    if (!App.ui.dragStart) {
                        App.ui.dragStart = { x: centerX, y: centerY };
                        App.ui.dragStartViewport = { x: App.viewport.x, y: App.viewport.y };
                    } else {
                        const dx = centerX - App.ui.dragStart.x;
                        const dy = centerY - App.ui.dragStart.y;
                        App.viewport.x = App.ui.dragStartViewport.x + dx;
                        App.viewport.y = App.ui.dragStartViewport.y + dy;
                        ViewportManager.updateTransform();
                    }
                    // Zoom pinch se podría implementar aquí midiendo la distancia entre pts
                } else if (e.button === 1 || App.ui.activePointers.size === 1) {
                    // Pan con mouse
                     const dx = e.clientX - App.ui.dragStart.x;
                     const dy = e.clientY - App.ui.dragStart.y;
                     App.viewport.x = App.ui.dragStartViewport.x + dx;
                     App.viewport.y = App.ui.dragStartViewport.y + dy;
                     ViewportManager.updateTransform();
                }
                return;
            }

            // Herramienta
            if (App.ui.isDragging) {
                const wp = ViewportManager.screenToWorld(e.clientX, e.clientY);
                const tool = Tools[App.ui.currentTool];
                if (tool && tool.move) tool.move(wp, e);
            } else if (App.ui.currentTool === 'draw' && App.ui.subTool === 'polyline' && App.ui.tempElement) {
                // Previsualizar polilínea sin arrastrar
                const wp = ViewportManager.screenToWorld(e.clientX, e.clientY);
                const tool = Tools['draw'];
                tool.move(wp, e);
            }
        }

        function handlePointerUp(e) {
            App.ui.activePointers.delete(e.pointerId);

            if (App.ui.isPanning && App.ui.activePointers.size === 0) {
                App.ui.isPanning = false;
                App.ui.dragStart = null;
                App.DOM.workspace.style.cursor = ''; // Restaurar el cursor de la clase activa
                return;
            }

            if (App.ui.isDragging) {
                App.ui.isDragging = false;
                const tool = Tools[App.ui.currentTool];
                if (tool && tool.up) tool.up();
            }
        }

        
        const UI = {
            updateDrawingHelper(show, text = "") {
                const helper = document.getElementById('drawing-helper-bar');
                const helperText = document.getElementById('drawing-helper-text');
                if (!helper) return;
                if (show) {
                    if (helperText && text) helperText.textContent = text;

                    helper.classList.remove('visible');
                }

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            },
            promptText(title, defaultText, callback) {
                const modal = document.getElementById('text-input-modal');
                const input = document.getElementById('modal-input');
                document.getElementById('modal-title').textContent = title;
                input.value = defaultText;
                modal.classList.add('active');
                input.focus();

                const onConfirm = () => {
                    modal.classList.remove('active');
                    cleanup();
                    callback(input.value);
                };
                const onCancel = () => {
                    modal.classList.remove('active');
                    cleanup();
                };
                
                const btnConfirm = document.getElementById('modal-confirm');
                const btnCancel = document.getElementById('modal-cancel');
                
                btnConfirm.onclick = onConfirm;
                btnCancel.onclick = onCancel;
                
                const onKey = (e) => { if(e.key === 'Enter') onConfirm(); if(e.key === 'Escape') onCancel(); };
                input.addEventListener('keydown', onKey);
                
                function cleanup() {
                    btnConfirm.onclick = null; btnCancel.onclick = null;
                    input.removeEventListener('keydown', onKey);
                }
            },
            setTool(toolName) {
                // Siempre guardar cualquier trazo o forma en curso al cambiar de herramienta
                commitPendingDrawing();

                App.ui.currentTool = toolName;
                App.ui.selectedId = null; // Deseleccionar
                Renderer.renderAll();
                
                // Actualizar botones
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.tool-btn[data-tool="${toolName}"]`).classList.add('active');

                // Actualizar cursor visual
                App.DOM.workspace.classList.remove('tool-select', 'tool-draw', 'tool-shapes', 'tool-pencil', 'tool-measure', 'tool-annotate', 'tool-erase');
                App.DOM.workspace.classList.add('tool-' + toolName);

                // Sub-toolbar dinámico
                const sub = document.getElementById('sub-toolbar');
                sub.innerHTML = '';
                if (toolName === 'draw') {
                    if (App.ui.subTool !== 'line' && App.ui.subTool !== 'polyline') App.ui.subTool = 'line';
                    sub.innerHTML = `

                        <button class="subtool-btn ${App.ui.subTool==='square'?'active':''}" data-sub="square">🟩 Cuadrado</button>

                        <button class="subtool-btn ${App.ui.subTool==='triangle'?'active':''}" data-sub="triangle">🔺 Triángulo</button>

            exportJSON() {

                const dlAnchorElem = document.createElement('a');

            exportPDF(author, projectName) {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    
                    const proj = projectName || App.data.project.name || 'Plano Marmolería';
                    const auth = author || localStorage.getItem('marmoleria_author') || 'Personal técnico';
                    const fechaStr = new Date().toLocaleDateString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit' });

                    // Cabecera profesional estilo membrete técnico
                    doc.setFont(undefined, 'bold');
                    doc.setFontSize(15);
                    doc.text("MARMOLERÍA BENJAMÍN", 12, 14);
                    
                    doc.setFont(undefined, 'normal');
                    doc.setFontSize(9.5);
                    doc.text(`Proyecto: ${proj}`, 12, 21);
                    doc.text(`Realizado por: ${auth}`, 12, 27);
                    
                    doc.text(`Fecha: ${fechaStr}`, 215, 21);
                    doc.text("Plano Técnico A4 (Taller / Fabricación)", 215, 27);
                    
                    doc.setDrawColor(200, 200, 200);
                    doc.setLineWidth(0.4);
                    doc.line(12, 31, 285, 31); // Separador superior

                    // Pie de página
                    doc.setFontSize(8);
                    doc.setTextColor(130);
                    doc.text(`Marmolería Benjamín • Documento emitido para fabricación • ${proj} • Responsable: ${auth}`, 12, 203);

                    // Bounding Box
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    
                    App.data.elements.forEach(el => {
                        const pts = [];
                        if (el.type === 'line' || el.type === 'measure') pts.push(el.start, el.end);
                        if (el.type === 'polyline' || el.type === 'pencil') pts.push(...el.points);
                        if (el.type === 'rect' || el.type === 'square') pts.push(el.start, el.end);
                        if (el.type === 'circle') {
                            pts.push({ x: el.center.x - el.radius, y: el.center.y - el.radius });
                            pts.push({ x: el.center.x + el.radius, y: el.center.y + el.radius });
                        }
                        if (el.type === 'triangle') pts.push(...el.points);
                        if (el.type === 'text') pts.push(el.position);
                        
                        pts.forEach(p => {
                            if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
                            if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
                        });
                    });

                    if (minX !== Infinity && App.data.elements.length > 0) {
                        const pdfW = 270;
                        const pdfH = 160;
                        const geomW = (maxX - minX) || 1;
                        const geomH = (maxY - minY) || 1;
                        
                        const scale = Math.min(pdfW / geomW, pdfH / geomH) * 0.88;
                        const offsetX = 12 + (pdfW - geomW * scale) / 2;
                        const offsetY = 35 + (pdfH - geomH * scale) / 2;

                        const toPdfX = (x) => offsetX + (x - minX) * scale;
                        const toPdfY = (y) => offsetY + (y - minY) * scale;

                        doc.setLineWidth(0.5);

                        App.data.elements.forEach(el => {
                            if (el.type === 'line' || el.type === 'measure') {
                                if (el.type === 'measure') {
                                    doc.setLineDash([2, 2]);
                                    doc.setDrawColor(120, 120, 120);
                                    doc.setTextColor(60, 60, 60);
                                } else {
                                    doc.setLineDash([]);
                                    doc.setDrawColor(20, 20, 20);
                                    doc.setTextColor(0, 0, 0);
                                }
                                
                                doc.line(toPdfX(el.start.x), toPdfY(el.start.y), toPdfX(el.end.x), toPdfY(el.end.y));
                                
                                if (el.type === 'measure') {
                                    const mx = toPdfX((el.start.x + el.end.x) / 2);
                                    const my = toPdfY((el.start.y + el.end.y) / 2);
                                    const val = el.value || "";
                                    doc.setFontSize(9);
                                    doc.text(val, mx, my - 2, { align: 'center' });
                                }
                            }
                            if (el.type === 'polyline' || el.type === 'pencil') {
                                doc.setLineDash([]);
                                doc.setDrawColor(20, 20, 20);
                                for (let i = 0; i < el.points.length - 1; i++) {
                                    doc.line(toPdfX(el.points[i].x), toPdfY(el.points[i].y), toPdfX(el.points[i+1].x), toPdfY(el.points[i+1].y));
                                }
                            }
                            if (el.type === 'rect' || el.type === 'square') {
                                doc.setLineDash([]);
                                doc.setDrawColor(20, 20, 20);
                                const x = toPdfX(Math.min(el.start.x, el.end.x));
                                const y = toPdfY(Math.min(el.start.y, el.end.y));
                                const w = Math.abs(el.start.x - el.end.x) * scale;
                                const h = Math.abs(el.start.y - el.end.y) * scale;
                                doc.rect(x, y, w, h);
                            }
                            if (el.type === 'circle') {
                                doc.setLineDash([]);
                                doc.setDrawColor(20, 20, 20);
                                const cx = toPdfX(el.center.x);
                                const cy = toPdfY(el.center.y);
                                const r = el.radius * scale;
                                doc.circle(cx, cy, r);
                            }
                            if (el.type === 'triangle') {
                                doc.setLineDash([]);
                                doc.setDrawColor(20, 20, 20);
                                const p0 = { x: toPdfX(el.points[0].x), y: toPdfY(el.points[0].y) };
                                const p1 = { x: toPdfX(el.points[1].x), y: toPdfY(el.points[1].y) };
                                const p2 = { x: toPdfX(el.points[2].x), y: toPdfY(el.points[2].y) };
                                doc.line(p0.x, p0.y, p1.x, p1.y);
                                doc.line(p1.x, p1.y, p2.x, p2.y);
                                doc.line(p2.x, p2.y, p0.x, p0.y);
                            }
                            if (el.type === 'text') {
                                doc.setTextColor(20, 20, 20);
                                doc.setFontSize(11);
                                doc.text(el.text, toPdfX(el.position.x), toPdfY(el.position.y));
                            }
                        });
                    }

                    const safeName = (proj).replace(/[^a-zA-Z0-9_-]/g, '_');
                    doc.save(`Plano_${safeName}.pdf`);
                    UI.showToast("📄 PDF exportado con éxito");
                } catch (e) {
                    console.error("Error al exportar PDF:", e);
                    UI.showToast("Error al exportar PDF. Verifique conexión.");
                }
            },

            async generateBlueprintImage() {
                return new Promise((resolve) => {
                    try {
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        App.data.elements.forEach(el => {
                            const pts = [];
                            if (el.type === 'line' || el.type === 'measure') pts.push(el.start, el.end);
                            if (el.type === 'polyline' || el.type === 'pencil') pts.push(...el.points);
                            if (el.type === 'rect' || el.type === 'square') pts.push(el.start, el.end);
                            if (el.type === 'circle') {
                                pts.push({ x: el.center.x - el.radius, y: el.center.y - el.radius });
                                pts.push({ x: el.center.x + el.radius, y: el.center.y + el.radius });
                            }
                            if (el.type === 'triangle') pts.push(...el.points);
                            if (el.type === 'text') pts.push(el.position);
                            pts.forEach(p => {
                                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                            });
                        });

                        if (minX === Infinity || App.data.elements.length === 0) {
                            resolve(null);
                            return;
                        }

                        const pad = 40;
                        const w = Math.max(300, Math.ceil(maxX - minX + pad * 2));
                        const h = Math.max(200, Math.ceil(maxY - minY + pad * 2));
                        const viewBox = `${minX - pad} ${minY - pad} ${w} ${h}`;

                        const sceneSvg = App.DOM.scene.innerHTML;
                        const fullSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${viewBox}">
                            <rect width="100%" height="100%" fill="#ffffff"/>
                            <defs>
                                <style>
                                    :root { --c-surface: #ffffff; --c-active: #000000; --c-text-muted: #666666; --c-select: #007aff; }
                                    .svg-line, .svg-poly, .svg-rect, .svg-circle, .svg-pencil { fill: none; stroke: #1a1a1a; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
                                    .svg-text { fill: #1a1a1a; font-family: sans-serif; font-size: 15px; }
                                </style>
                            </defs>
                            ${sceneSvg}
                        </svg>`;

                        const canvas = document.createElement('canvas');
                        canvas.width = w * 2;
                        canvas.height = h * 2;
                        const ctx = canvas.getContext('2d');
                        ctx.scale(2, 2);

                        const img = new Image();
                        const blob = new Blob([fullSvg], { type: 'image/svg+xml;charset=utf-8' });
                        const url = URL.createObjectURL(blob);

                        img.onload = () => {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, w, h);
                            ctx.drawImage(img, 0, 0, w, h);
                            URL.revokeObjectURL(url);
                            try {
                                resolve(canvas.toDataURL('image/png'));
                            } catch(e) {
                                resolve(null);
                            }
                        };
                        img.onerror = () => {
                            URL.revokeObjectURL(url);
                            resolve(null);
                        };
                        img.src = url;
                    } catch (e) {
                        console.error("Error al generar imagen de plano:", e);
                        resolve(null);
                    }
                });
            },

            async exportWord(author, projectName) {
                try {
                    UI.showToast("⏳ Generando documento Word...");
                    const proj = projectName || App.data.project.name || 'Plano Marmolería';
                    const auth = author || localStorage.getItem('marmoleria_author') || 'Personal técnico';
                    const fechaStr = new Date().toLocaleDateString('es-AR', { year: 'numeric', month: 'long', day: 'numeric' });

                    const imgDataUrl = await this.generateBlueprintImage();

                    // Medidas y cotas
                    const measures = App.data.elements.filter(e => e.type === 'measure');
                    const texts = App.data.elements.filter(e => e.type === 'text');
                    const geometriesCount = App.data.elements.filter(e => e.type !== 'measure' && e.type !== 'text').length;

                    let measuresHtml = '';
                    if (measures.length > 0) {
                        measuresHtml = measures.map((m, idx) => `
                            <tr>
                                <td style="padding: 6px 10px; border: 1px solid #ccc; text-align: center;">${idx + 1}</td>
                                <td style="padding: 6px 10px; border: 1px solid #ccc;">Cota / Longitud</td>
                                <td style="padding: 6px 10px; border: 1px solid #ccc; font-weight: bold; color: #1565c0;">${m.value || 'Sin definir'}</td>
                            </tr>
                        `).join('');
                    } else {
                        measuresHtml = '<tr><td colspan="3" style="padding: 8px; border: 1px solid #ccc; text-align: center; color: #777;">No se registraron cotas automáticas</td></tr>';
                    }

                    let notesHtml = '';
                    if (texts.length > 0) {
                        notesHtml = texts.map((t, idx) => `
                            <tr>
                                <td style="padding: 6px 10px; border: 1px solid #ccc; text-align: center;">${idx + 1}</td>
                                <td style="padding: 6px 10px; border: 1px solid #ccc;">${t.text}</td>
                            </tr>
                        `).join('');
                    } else {
                        notesHtml = '<tr><td colspan="2" style="padding: 8px; border: 1px solid #ccc; text-align: center; color: #777;">Sin notas registradas</td></tr>';
                    }

                    const wordHtml = `
                        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                        <head>
                            <meta charset='utf-8'>
                            <title>${proj}</title>
                            <!--[if gte mso 9]>
                            <xml>
                            <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                            <w:DoNotOptimizeForBrowser/>
                            </w:WordDocument>
                            </xml>
                            <![endif]-->
                            <style>
                                body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; margin: 35px; color: #1a1a1a; }
                                h1 { font-size: 20pt; color: #111; margin-bottom: 2px; }
                                .subtitle { font-size: 12pt; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 15px; }
                                .header-bar { height: 3px; background: #111; margin-bottom: 20px; }
                                .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
                                .meta-table td { padding: 8px 12px; border: 1px solid #ccc; font-size: 10.5pt; }
                                .meta-label { background: #f2f2f2; font-weight: bold; width: 22%; }
                                .blueprint-container { text-align: center; margin: 25px 0; padding: 15px; border: 1px solid #ddd; background: #fafafa; }
                                h2 { font-size: 13pt; color: #111; margin-top: 25px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
                                .table-data { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 10pt; }
                                .table-data th { background: #222; color: #fff; padding: 8px 10px; border: 1px solid #222; text-align: left; }
                                .footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 10px; font-size: 9pt; color: #888; text-align: right; }
                            </style>
                        </head>
                        <body>
                            <h1>MARMOLERÍA BENJAMÍN</h1>
                            <div class="subtitle">Ficha Técnica y Plano de Fabricación</div>
                            <div class="header-bar"></div>

                            <table class="meta-table">
                                <tr>
                                    <td class="meta-label">Proyecto / Cliente:</td>
                                    <td><strong>${proj}</strong></td>
                                    <td class="meta-label">Fecha de Emisión:</td>
                                    <td>${fechaStr}</td>
                                </tr>
                                <tr>
                                    <td class="meta-label">Realizado por:</td>
                                    <td><strong style="color: #1565c0;">${auth}</strong></td>
                                    <td class="meta-label">Piezas / Trazos:</td>
                                    <td>${geometriesCount} elementos de corte</td>
                                </tr>
                            </table>

                            <h2>Vista Gráfica del Plano</h2>
                            <div class="blueprint-container">
                                ${imgDataUrl ? `<img src="${imgDataUrl}" style="max-width: 100%; height: auto;" alt="Plano de marmolería" />` : '<p style="color: #888; font-style: italic;">(Sin elementos vectoriales dibujados en el plano)</p>'}
                            </div>

                            <h2>Detalle de Cotas y Medidas</h2>
                            <table class="table-data">
                                <thead>
                                    <tr>
                                        <th style="width: 10%; text-align: center;">#</th>
                                        <th style="width: 40%;">Tipo</th>
                                        <th style="width: 50%;">Medida Registrada</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${measuresHtml}
                                </tbody>
                            </table>

                            <h2>Anotaciones y Observaciones Técnicas</h2>
                            <table class="table-data">
                                <thead>
                                    <tr>
                                        <th style="width: 10%; text-align: center;">#</th>
                                        <th style="width: 90%;">Texto de Anotación</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${notesHtml}
                                </tbody>
                            </table>

                            <div class="footer">
                                Documento emitido por el sistema técnico de Marmolería Benjamín • Uso interno y taller
                            </div>
                        </body>
                        </html>
                    `;

                    const blob = new Blob(['\ufeff' + wordHtml], { type: 'application/msword;charset=utf-8' });
                    const a = document.createElement('a');
                    const safeName = (proj).replace(/[^a-zA-Z0-9_-]/g, '_');
                    a.href = URL.createObjectURL(blob);
                    a.download = `Plano_${safeName}.doc`;
                    a.click();

                    UI.showToast("📝 Documento Word exportado con éxito");
                } catch(e) {
                    console.error("Error al exportar a Word:", e);
                    UI.showToast("Error al exportar a Word");
                }
            },

            exportWhatsApp(author, projectName, phone) {
                const proj = projectName || App.data.project.name || 'Plano Marmolería';
                const auth = author || localStorage.getItem('marmoleria_author') || 'Personal técnico';
                const fechaStr = new Date().toLocaleDateString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit' });

                // Descargar el PDF para que el usuario lo tenga listo para adjuntar
                this.exportPDF(auth, proj);

                // Construir mensaje enriquecido
                const measures = App.data.elements.filter(e => e.type === 'measure');
                const texts = App.data.elements.filter(e => e.type === 'text');

                let msg = `*MARMOLERÍA BENJAMÍN*\n`;
                msg += `📐 *Plano Técnico de Fabricación*\n`;
                msg += `─────────────────────────\n`;
                msg += `📋 *Proyecto:* ${proj}\n`;
                msg += `👤 *Realizado por:* ${auth}\n`;
                msg += `📅 *Fecha:* ${fechaStr}\n`;

                if (measures.length > 0) {
                    msg += `\n📏 *Medidas y Cotas registradas:*\n`;
                    measures.forEach((m, idx) => {
                        msg += `  • Medida ${idx + 1}: *${m.value || 'Sin valor'}*\n`;
                    });
                }

                if (texts.length > 0) {
                    msg += `\n📝 *Anotaciones de obra:*\n`;
                    texts.forEach((t, idx) => {
                        msg += `  • Nota ${idx + 1}: _${t.text}_\n`;
                    });
                }

                msg += `─────────────────────────\n`;
                msg += `📎 *(Descargué el archivo PDF del plano en mi dispositivo para adjuntarlo a este chat)*`;

                const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
                let waUrl = cleanPhone
                    ? `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(msg)}`
                    : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;

                window.open(waUrl, '_blank');
                UI.showToast("💬 Abriendo WhatsApp y descargando PDF...");
            }
        };

        
        function init() {
            // Eventos de Herramientas
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    UI.setTool(e.currentTarget.getAttribute('data-tool'));
                });
            });

            // Eventos de Puntero en SVG
            App.DOM.svg.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove); // Global para no perder el drag
            window.addEventListener('pointerup', handlePointerUp);
            App.DOM.svg.addEventListener('dblclick', (e) => {
                const tool = Tools[App.ui.currentTool];
                if (tool && tool.dblclick) {
                    const wp = ViewportManager.screenToWorld(e.clientX, e.clientY);
                    tool.dblclick(wp, e);
                }
            });

            // Zoom con rueda de ratón
            App.DOM.svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                // Si presiona Ctrl, es zoom (estándar en navegadores), si no, lo tomamos como zoom también
                ViewportManager.zoom(e.deltaY, e.clientX, e.clientY);
            }, { passive: false });

            // Botones Superiores
            document.getElementById('btn-undo').addEventListener('click', () => HistoryManager.undo());
            document.getElementById('btn-redo').addEventListener('click', () => HistoryManager.redo());
            document.getElementById('btn-clear').addEventListener('click', () => {
                if(confirm("¿Comenzar un plano nuevo? (Se perderá lo no guardado)")) {
                    App.data.elements = [];
                    HistoryManager.clear();
                    Renderer.renderAll();
                    App.viewport = {x:0, y:0, scale:1};
                    ViewportManager.updateTransform();
                }
            });
            document.getElementById('btn-grid').addEventListener('click', (e) => {
                const ws = App.DOM.workspace;
                ws.classList.toggle('grid-on');
                App.settings.snapToGrid = ws.classList.contains('grid-on');
                e.target.style.background = App.settings.snapToGrid ? 'var(--c-active-bg)' : 'transparent';
            });

            // Botón de exportar abre la modal interactiva
            document.getElementById('btn-export').addEventListener('click', () => {
                ExportManager.openModal();
            });

            // Eventos de la modal de exportación
            document.getElementById('export-modal-close').addEventListener('click', () => ExportManager.closeModal());
            document.getElementById('export-modal-cancel').addEventListener('click', () => ExportManager.closeModal());
            document.getElementById('export-modal').addEventListener('click', (e) => {
                if (e.target.id === 'export-modal') ExportManager.closeModal();
            });

            const authorInput = document.getElementById('export-author');
            authorInput.addEventListener('input', () => {
                if (authorInput.value.trim()) {
                    authorInput.classList.remove('input-error');
                    const err = document.getElementById('author-error');
                    if (err) err.style.display = 'none';
                }
            });

            document.getElementById('btn-modal-pdf').addEventListener('click', () => {
                const info = ExportManager.validateAndGetInfo();
                if (!info) return;
                ExportManager.exportPDF(info.author, info.projectName);
                ExportManager.closeModal();
            });

            document.getElementById('btn-modal-word').addEventListener('click', () => {
                const info = ExportManager.validateAndGetInfo();
                if (!info) return;
                ExportManager.exportWord(info.author, info.projectName);
                ExportManager.closeModal();
            });

            document.getElementById('btn-modal-whatsapp').addEventListener('click', () => {
                const info = ExportManager.validateAndGetInfo();
                if (!info) return;
                ExportManager.exportWhatsApp(info.author, info.projectName, info.phone);
                ExportManager.closeModal();
            });

            document.getElementById('btn-modal-json').addEventListener('click', () => {
                ExportManager.exportJSON();
                ExportManager.closeModal();
            });

            // Clic derecho para cortar y finalizar trazado de líneas o figuras (Desktop y Trackpad)
            window.addEventListener('contextmenu', (e) => {
                if (e.target.closest('#workspace') || e.target.closest('#canvas') || App.ui.tempElement) {
                    e.preventDefault();
                    if (App.ui.tempElement) {
                        if (App.ui.tempElement.type === 'polyline') {
                            Tools.draw.finishPolyline();
                        } else {
                            commitPendingDrawing();
                        }
                    }
                }
            });

            // Botones de la barra flotante de trazado (Touch / iPad / Desktop)
            const helperBar = document.getElementById('drawing-helper-bar');
            const helperFinish = document.getElementById('btn-finish-drawing');
            const helperCancel = document.getElementById('btn-cancel-drawing');

            if (helperBar) {
                helperBar.addEventListener('pointerdown', (e) => e.stopPropagation());
                helperBar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
            }
            if (helperFinish) {
                helperFinish.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (App.ui.tempElement) {
                        if (App.ui.tempElement.type === 'polyline') {
                            Tools.draw.finishPolyline();
                        } else {
                            commitPendingDrawing();
                        }
                    }
                });
            }
            if (helperCancel) {
                helperCancel.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (App.ui.tempElement) {
                        if (App.ui.tempElement.type === 'polyline') {
                            Tools.draw.cancelPolyline();
                        } else {
                            App.ui.tempElement = null;
                            Renderer.renderPreview();
                            Renderer.renderAll();
                            UI.updateDrawingHelper(false);
                            UI.showToast("Trazado cancelado");
                        }
                    }
                });
            }

            // Eventos del Editor Inline en el lienzo (para cotas y anotaciones sin modales)
            const inlineEditorEl = document.getElementById('canvas-inline-editor');
            const inlineInputEl = document.getElementById('inline-text-input');
            if (inlineEditorEl && inlineInputEl) {
                inlineEditorEl.addEventListener('pointerdown', (e) => e.stopPropagation());
                inlineEditorEl.addEventListener('mousedown', (e) => e.stopPropagation());
                inlineEditorEl.addEventListener('click', (e) => e.stopPropagation());
                inlineEditorEl.addEventListener('dblclick', (e) => e.stopPropagation());

                inlineInputEl.addEventListener('keydown', (e) => {
                    e.stopPropagation();
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        CanvasInlineEditor.commit();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        CanvasInlineEditor.cancel();
                    }
                });

                inlineInputEl.addEventListener('blur', () => {
                    setTimeout(() => {
                        if (CanvasInlineEditor._isOpen) {
                            CanvasInlineEditor.commit();
                        }
                    }, 120);
                });
            }

            // Teclado: Escape para finalizar/cortar trazo, Enter para confirmar, Suprimir / Backspace para borrar
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (App.ui.tempElement) {
                        if (App.ui.tempElement.type === 'polyline') {
                            Tools.draw.finishPolyline();
                        } else {
                            commitPendingDrawing();
                        }
                        return;
                    }
                } else if (e.key === 'Enter') {
                    if (App.ui.tempElement && App.ui.tempElement.type === 'polyline') {
                        Tools.draw.finishPolyline();
                        return;
                    }
                }

                if ((e.key === 'Delete' || e.key === 'Backspace') && App.ui.selectedId) {
                    const tag = (document.activeElement ? document.activeElement.tagName.toLowerCase() : '');
                    if (tag === 'input' || tag === 'textarea') return;
                    HistoryManager.pushState();
                    App.data.elements = App.data.elements.filter(el => el.id !== App.ui.selectedId);
                    App.ui.selectedId = null;
                    Renderer.renderAll();
                    UI.showToast("Elemento eliminado");
                }
            });

            // Cargar y Renderizar
            StorageManager.load();
            ViewportManager.updateTransform();
            UI.setTool('draw'); // Herramienta por defecto
        }

        window.onload = init;

    </script>
</body>
